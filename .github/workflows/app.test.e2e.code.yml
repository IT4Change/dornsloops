name: test:e2e

on:
  push:
    branches:
      - master
  pull_request: null

jobs:
  e2e:
    name: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # Chromium only, the same one the config drives. `--with-deps` because a runner has
      # none of the shared libraries a browser needs.
      - run: npx playwright install --with-deps chromium
      # The suite builds the site itself (`nuxt generate`) and serves the result — see
      # `playwright.config.ts`. Nothing to start here.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        # A failing run is the one whose report is worth having, and traces are only
        # recorded on a retry.
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
