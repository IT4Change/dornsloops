name: build

on:
  push:
    branches:
      - master
  pull_request: null

jobs:
  build:
    name: nuxt generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # The artefact `deploy.sh` puts online: the prerendered site, built through the script
      # so the zone is pinned the same way. The e2e suite builds it too, but inside Playwright's
      # `webServer`, where a failing build reads as a server that never came up.
      - run: npm run generate
      # The same guard `deploy.sh` applies before publishing. No upload: the server builds its
      # own copy from the release tag, and the loop videos would make every run's artefact
      # some 180 MB.
      - name: Check build output
        run: |
          if [ ! -f .output/public/index.html ]; then
            echo "::error::build produced no index.html"
            exit 1
          fi
